# argus-config.schema.yaml — the SUT config contract (VR-A1)
#
# Derived from argus `argus-config.example.yaml`. `validate-config` checks a config
# against this schema AND runs argus preflight.py (layer<->targets coverage).
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://onedroid.ai/schemas/argus-config.schema.yaml"
title: "argus-config"
type: object
additionalProperties: true
required: [project, targets]
properties:
  project:
    type: object
    required: [name]
    properties:
      name: { type: string }
  targets:
    type: object
    # VR10-S3 (V28-012): keys under `targets` are STRICT in code — an unknown key is refused at load,
    # by name, with the accepted list. Beside each plain slot a `<kind>_targets` map holds any number
    # of named extras of the SAME shape; a scenario selects one by `- **Target**: <name>`.
    additionalProperties: false
    description: "Only include sections for the layers you test (preflight enforces coverage)."
    properties:
      http:
        $ref: "#/$defs/http_target"
      http_targets:
        type: object
        additionalProperties: { $ref: "#/$defs/http_target" }
      message_broker:
        $ref: "#/$defs/message_broker_target"
      message_broker_targets:
        type: object
        additionalProperties: { $ref: "#/$defs/message_broker_target" }
      database:
        $ref: "#/$defs/database_target"
      database_targets:
        type: object
        additionalProperties: { $ref: "#/$defs/database_target" }
      external:
        oneOf: [{ type: array }, { type: object }]
      auth:
        type: object
        properties:
          # VR-TH1: `api-key` and `mtls` REMOVED 2026-09-22 — neither had any implementation, and
          # neither COULD be honoured as declared: AuthTarget carries exactly one credential field
          # (bearer_token), so there is no header-name for an api-key and no cert/key pair for mtls.
          type: { enum: [bearer, clerk_session, none] }
          bearer_token: { type: string }
          # clerk_session keys. The two *_env values are environment variable NAMES (the
          # Secret exec-tokens carries the values), never the key itself. Enforced in internal/config
          # (clerksession.go): both refs required with clerk_session, refused without it.
          secret_key_env: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
          user_id_env: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
          jwt_template: { type: string, pattern: "^[A-Za-z0-9_.-]+$" }
          api_url: { type: string }                      # default https://api.clerk.com
          allow_clerk_session_on_prod: { type: boolean } # default false; the explicit production opt-in
      mcp:
        $ref: "#/$defs/mcp_target"
      mcp_targets:
        type: object
        additionalProperties: { $ref: "#/$defs/mcp_target" }
  scenarios:
    type: object
    properties:
      timeout_default: { type: string, pattern: "^[0-9]+(ms|s)$" }
      # V29-015: `cleanup_enabled` REMOVED — ## CLEANUP always runs; there is no off switch.
      parallel_layers: { type: boolean }
  # VR10-R1 (V28-009): the SUT DECLARES its own rate limit and how it says "you are going too fast".
  # TOP-LEVEL, never under `targets`. The retired key there was about TESTING a limiter and is gone
  # (VR10-S3-13; V28-019 owns that concept); this block is about RESPECTING one. Absent = nothing
  # changes: Argus never guesses a throttle.
  #
  # Unknown keys under rate_limit / signature / pause are refused at load, by name, in CODE — the
  # `additionalProperties: false` below documents that; it does not enforce it.
  # T5.4, made the OWNER'S switch by: Argus is agnostic about what a system's checks may
  # do. `money_handling: true` is a switch the system's owner sets in the owner's own config and it means
  # "refuse what my money_writes.allow list does not name". ENFORCED IN CODE at every door (config.Validate,
  # argus.runOneScenario and the control plane, via scenario.MoneyGuardViolations). With it on and no
  # list, only plain HTTP GETs of paths naming no order/quote/swap/rebalance/claim run; every MCP tool
  # call, bus op, db step, logs step, UI drive and any CLEANUP that runs something is refused by name.
  # Absent = false = nothing is enforced.
  money_handling:
    type: boolean
    description: "true = refuse what money_writes.allow does not name: with no list, every scenario must be a plain HTTP GET on a path naming no money word, with CLEANUP N/A. Refused otherwise, at validate time AND at run time."
  # The owner's list (T5.4 follow-up 2026-09-26; every engine). VALID ONLY beside
  # money_handling: true, never empty. Strict at load: an unknown or mistyped key is refused by name with
  # its entry index (`money_writes.allow[3]: …`). An entry never widens: another path, queue, routing key,
  # op or tool than the one named is refused as if unlisted. An amqp or mcp entry is ALL-OR-NOTHING for that
  # op/tool: Argus cannot cap a bus publish or a tool call the way max_amount caps an HTTP body.
  money_writes:
    type: object
    additionalProperties: false
    required: [allow]
    properties:
      allow:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          properties:
            engine:
              type: string
              enum: [http, amqp, mcp, db, logs, cleanup, ui, fault]
              description: "absent or http = an HTTP entry (method + path); amqp | mcp | db | logs | cleanup | ui | fault = one step kind. Fields of the other kinds are refused. cleanup, ui and fault need an execution plane that has them: an older one refuses the entry when the config loads."
            # ── an HTTP entry ──
            method: { type: string, description: "HTTP entry: required. GET is accepted (it exempts the money-word path rule for that route) and must be spends: false." }
            path:
              type: string
              description: "HTTP entry: required, exact, starting with '/'. A whole segment may be a placeholder {name} (letters, digits, underscore) matching exactly one non-empty segment. No '*', no '?', no partial-segment placeholder (x{id}), no ${…}."
            spends: { type: boolean, description: "HTTP entry: required. Refused on every other engine." }
            amount_field: { type: string, description: "HTTP entry, spends: true: dotted path into the JSON request body." }
            max_amount: { type: number, description: "HTTP entry, spends: true: per-request ceiling (> 0)." }
            max_per_run: { type: integer, description: "HTTP entry, spends: true: spends per run, across every scenario (>= 1)." }
            # ── an amqp entry ──
            op:
              type: string
              enum: [publish, consume, listen, declare_queue, declare_exchange, queue_bind, queue_delete, queue_unbind, exchange_delete]
              description: "amqp entry: required."
            exchange: { type: string, description: "amqp: used by publish (\"\" = the default exchange), listen, queue_bind, declare_exchange, queue_unbind, exchange_delete. Compared exactly." }
            routing_key: { type: string, description: "amqp: used by publish, listen, queue_bind and queue_unbind. Compared exactly." }
            queue: { type: string, description: "amqp: used by consume, declare_queue, queue_bind, queue_delete, queue_unbind. Compared exactly." }
            stream: { type: string, description: "amqp, op: listen only: allows a chain `bus` step bound by `stream: <this name>`, compared exactly. Never together with exchange or routing_key (ambiguous: refused). It never covers a bus step bound by exchange + routing_key, and an exchange + routing_key listen entry never covers a stream-bound step. Only the executor's config can resolve a stream, so the entry names the stream itself." }
            # ── an mcp or db entry ──
            target: { type: string, description: "mcp: a key of targets.mcp_targets (absent = targets.mcp). db: a key of targets.database_targets (absent = targets.database)." }
            tool: { type: string, description: "mcp entry: required, the exact tool name." }
            # ── a cleanup, ui or fault entry ──
            form:
              type: string
              enum: [sql, bash]
              description: "cleanup entry: required. Allows a runnable ## CLEANUP block of this form; listing the form allows whatever the block does (a sql block is any statement against targets.database, a bash block is sh -c in the executor). A scenario with blocks of both forms needs both entries; N/A needs none."
            spec:
              type: string
              description: "ui entry: required. The spec path exactly as the ui scenario or the ui chain step names it (the TRIGGER payload `spec`, else the TRIGGER url). Exact match; a spec built at run time (${…}) never matches. The entry allows whatever that spec does in the browser: Argus cannot bound a browser drive. The generic read-only spec is tests/live/argus-declared.spec.ts. There is no app_url field: the page address can come from the runner's environment."
            # engine: fault takes no other field: it allows fault chain steps, and fault_allowed_targets still bounds what they may touch.
  # S9: the operator's explicit mark of the broker targets an `AMQP Load` scenario may
  # drive. TOP-LEVEL, never under `targets` (an older executor decodes `targets` strictly and would refuse
  # a new key there; a top-level key is ignored by it). OFF BY DEFAULT: absent / empty / unlisted = every
  # AMQP Load run is refused before anything is sent. ENFORCED IN CODE (config.LoadRefusal), at
  # validate-config AND in argus.runOneScenario. A shared/production-looking broker URL is refused.
  load_allowed_targets:
    type: object
    # an entry may also name a targets.http_targets entry, the target of an `HTTP Load` ramp;
    # max_sessions then caps the users of a step. A shared/production-looking base_url is refused.
    description: "name under targets.message_broker_targets (AMQP Load) or targets.http_targets (HTTP Load) -> { max_sessions }. Use only for a lab or dedicated test broker or deployment, never a live one."
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        max_sessions: { type: integer, minimum: 1, maximum: 10000, description: "Largest step this target may be asked for. Default 2000." }
  # the environment variable NAMES the checks use inside their own bodies, headers or chain steps
  # (`${SOME_PASSWORD}`), which no credential field names. TOP-LEVEL, never under `targets` (an older executor
  # decodes `targets` strictly): an executor built before this key IGNORES it, silently, so the names are never
  # scanned or delivered. NAMES ONLY, never values; each is read from <product-dir>/.env at onboarding exactly like
  # a credential `${VAR}`, and a name missing there is reported by name. Named `check_env` after `url_env` (an
  # amqp step's env-var NAME) and because a scenario is a "check" to its author.
  check_env:
    type: array
    maxItems: 64
    description: "Environment variable NAMES to deliver to the executor (letters A-Z, digits, underscore; not ARGUS_*, and none of the process-control names below). This list decides what is DELIVERED; any name present in the executor's environment is substituted by a `${NAME}` in a check. Names only, never values."
    items:
      type: string
      # Mirrored from config.CheckEnvReservedNames / CheckEnvReservedPrefixes (internal/config/checkenv.go);
      # TestCheckEnv_ReservedListAndSchemaDoNotDrift fails when the two differ. These names change how the
      # executor process itself runs, and on Kubernetes a declared name's value lands in the Secret the
      # executor pod takes its environment from.
      allOf:
        - pattern: "^[A-Z_][A-Z0-9_]*$"
        - not: { pattern: "^ARGUS_" }
        - not: { pattern: "^LD_" }
        - not: { pattern: "^KUBERNETES_" }
        - not: { pattern: "^(PATH|HOME|USER|SHELL|PWD|HOSTNAME|TMPDIR|JAVA_TOOL_OPTIONS|JAVA_HOME|GODEBUG|SSL_CERT_FILE|SSL_CERT_DIR|HTTP_PROXY|HTTPS_PROXY|NO_PROXY)$" }
  # `load_test: never` on a test_targets entry. TOP-LEVEL block (never under `targets`), strict
  # inside: an executor built before the key refuses the whole config that carries it, so upgrade the executor first.
  test_targets:
    type: array
    description: "Named slices of one instance's checks (docs/runbooks/TEST-TARGETS.md)."
    items:
      type: object
      additionalProperties: false
      required: [name, match]
      properties:
        name: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
        label: { type: string }
        namespace: { type: string, description: "Informational; a load run's environment capture reads it. Refused together with outside_cluster." }
        outside_cluster: { type: boolean, description: "true = the system this target names does not run in a Kubernetes cluster (a hosted app behind a CDN): a load run's environment capture reads nothing from Kubernetes for it and says so. Refused together with namespace. Absent or false = today's behaviour. An executor built before this key refuses the whole config that carries it, so upgrade the executor first." }
        description: { type: string }
        match:
          type: object
          additionalProperties: false
          properties:
            scenario_prefixes: { type: array, items: { type: string } }
            tags: { type: array, items: { type: string } }
        dashboard_link_template: { type: string }
        load_test: { enum: [never], description: "never = this target must never be loaded: validate-config refuses a load check of it, the executor will not fire one, Capacity says 'not load tested, by declaration'. Absent = today's behaviour." }
  rate_limit:
    type: object
    additionalProperties: false
    required: [requests, per]
    properties:
      requests: { type: integer, minimum: 1, description: "How many requests the SUT accepts per window." }
      per: { enum: [minute, second], description: "The window. Nothing else is accepted." }
      signature:
        type: object
        additionalProperties: false
        properties:
          body_contains: { type: string, description: "The stable text in this SUT's refusal, matched against the MCP tool-error content. On the HTTP path the signature is the 429 status + Retry-After, and this is not consulted." }
          retry_after_field: { type: string, description: "Optional: the JSON field carrying the retry-after SECONDS. Absent -> the run pauses for the declared window." }
      pause:
        type: object
        additionalProperties: false
        properties:
          max_pauses: { type: integer, minimum: 0, description: "Pauses allowed in ONE run. Default 3." }
          max_total_wait: { type: string, description: "Total wall-clock ONE run may spend paused, e.g. 180s. Default 180s." }
          retry_once: { type: boolean, description: "Re-fire a throttled scenario once after the pause. Default true." }
  observability:
    type: object
    properties:
      prometheus: { type: object }
      loki: { type: object }
      grafana:
        type: object
        properties:
          dashboard_template: { type: string }   # COMMON - the same on every tier
          # PER-TIER (M3-FX): the browser-facing Grafana base. It is the only field in this file
          # whose correct value differs per environment. MANDATORY for the tier being onboarded to;
          # that requirement is enforced in CODE, not here, because the schema cannot know which
          # tier a given onboard targets.
          #
          # NOTE FOR ANYONE EDITING THIS FILE: nothing in the product loads this schema. It is the
          # published CONTRACT people read, and it is kept accurate for that reason - but adding a
          # `required:` here enforces nothing at runtime.
          public_url:
            type: object
            additionalProperties: false
            properties:
              compose: { type: string }
              k3d:     { type: string }
              managed: { type: string }
      # UI-2: an operator-set dashboard link template for ANY tool (Grafana, Zabbix,
      # Datadog, an internal page). The control plane renders it per run, so it works for every past run.
      # Placeholders: {run_id} {correlation_id} {instance} {target} {from} {to} ({from}/{to} are epoch
      # milliseconds; {correlation_id} is the run's prefix tr-<run_id>). Refused at load: not an absolute
      # http(s) URL, userinfo, ${VAR}, an unknown placeholder, an unmatched brace, over 2048 bytes.
      # See docs/ARGUS-GRAFANA-CONTRACT.md "Bring your own dashboard".
      dashboard_link:
        type: object
        properties:
          template: { type: string, maxLength: 2048 }
          label:    { type: string, maxLength: 60 }   # button text; default "Open dashboard"

# One shape per kind, shared by the plain slot and by its `<kind>_targets` map (VR10-S3 / V28-012):
# a named entry has EXACTLY the fields of its plain slot. `type:` on database/message_broker is
# documentation the product does not read (the JDBC driver is chosen from the URL).
$defs:
  http_target:
    type: object
    additionalProperties: false
    properties:
      base_url: { type: string }
      # a NAMED target's own auth (wins over targets.auth for scenarios that select it);
      # refused on the plain targets.http slot. Same shape as targets.auth.
      auth:
        type: object
        additionalProperties: false
        properties:
          type: { enum: [bearer, clerk_session, none] }
          bearer_token: { type: string }
          secret_key_env: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
          user_id_env: { type: string, pattern: "^[A-Za-z_][A-Za-z0-9_]*$" }
          jwt_template: { type: string, pattern: "^[A-Za-z0-9_.-]+$" }
          api_url: { type: string }
          allow_clerk_session_on_prod: { type: boolean }
  mcp_target:
    type: object
    additionalProperties: false
    properties:
      base_url: { type: string }
      transport: { enum: [streamable-http, http-sse] }
      timeout_seconds: { type: integer }
      auth:
        type: object
        additionalProperties: false
        properties:
          type: { enum: [bearer, none] }
          bearer_token: { type: string }
  database_target:
    type: object
    additionalProperties: false
    properties:
      # VR-TH1: WIDENED to the JDBC drivers the execution plane actually ships
      # (jmeter-plugins/amqp/docker/install-jdbc-drivers.sh). The driver is chosen from
      # the jdbc_url, never from this key, so [postgres, mysql] was NARROWER than reality and denied
      # mariadb/sqlserver/sqlite SUTs that work today. Oracle stays out: that script skips it on
      # licence grounds. ⚠ Enforced in internal/config (targetTypeErrors) — NOT by this file, which
      # nothing reads at run time.
      type: { enum: [postgres, postgresql, mysql, mariadb, sqlserver, sqlite, none] }
      jdbc_url: { type: string }
      username: { type: string, description: "MUST be read-only (Layer-3 contract)" }
      password: { type: string }
  message_broker_target:
    type: object
    additionalProperties: false
    properties:
      # VR-TH1: `kafka` REMOVED 2026-09-22 (the operator: "remove Kafka and any other tools we don't
      # actually have"). There is no Kafka engine anywhere in the tree — internal/amqpengine is the
      # only broker implementation — and this key is never dispatched on, so a `kafka` config was
      # accepted and then handled by the AMQP engine. Re-add it the day an engine exists, not before.
      type: { enum: [amqp, none] }
      url: { type: string }
      management_url: { type: string }
      exchanges: { type: object }
      queues: { type: object }
      # V30-004: the key the Message Flow tap binds with. `targets` is decoded with KnownFields(true)
      # and this block is additionalProperties:false, so the struct, the schema and the validator
      # must gain it together or a config carrying it is REFUSED rather than ignored.
      routing_keys: { type: object, description: "binding keys per exchange; `incoming` is the one the content tap binds with (V30-004)" }
      # the `bus` chain step. None of these holds a credential. An executor older than the bus step refuses
      # a config that carries them (targets keys are strict): upgrade the executor first, then the config.
      vhost: { type: string, description: "optional; must equal the vhost the url names (checked when a bus step runs)" }
      envelope:
        type: object
        additionalProperties: false
        description: "where the run's correlation id travels in this broker's messages; a bus step against a target without envelope.correlation is an error (no default)"
        properties:
          correlation:
            type: array
            description: "sources in order; a message is correlated when ANY holds the id (equal, or starting with '<id>.'). Each entry sets exactly one of property, header, body."
            items:
              type: object
              additionalProperties: false
              properties:
                property: { enum: [correlation_id, message_id, type, app_id, reply_to] }
                header: { type: string }
                body: { type: string, description: "dotted path into the decoded JSON body" }
          list_payload: { type: boolean, description: "the body is a JSON list; each object element is a record (GoKit)" }
      streams:
        type: object
        description: "named bindings a scenario's bus step selects with `stream`"
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            exchange: { type: string }
            routing_key: { type: string }
